# MediaMTX — слой записи (SPEC §2, §20).
#
# До цикла 24 этот файл описывал только приём чужих публикаций
# (`all_others: source: publisher`): камеры тянул воркер, поднимая по
# процессу `ffmpeg -c copy` на камеру ради републикации сюда, и он же писал
# архив через OpenCV с последующим перекодированием. SPEC §20 запрещает и
# то, и другое: «MediaMTX — единственный процесс, пишущий все камеры; не
# использовать 120 отдельных FFmpeg-процессов», §24 — «Перекодирование
# архива (только remux)».
#
# Теперь MediaMTX сам тянет основной поток каждой камеры (один pull на
# камеру, SPEC §2) и пишет его remux'ом. Пути заводятся не здесь, а через
# Control API из воркера (worker/record_layer.py): список камер живёт в БД
# и меняется без перезапуска слоёв (SPEC §2).

logLevel: info
rtspAddress: :8554
hlsAddress: :8888
webrtcAddress: :8889

# Control API — им воркер синхронизирует пути камер и читает состояние
# каждого потока записи для дашборда (SPEC §14). Порт наружу из контейнера
# не публикуется, доступен только по внутренней docker-сети.
api: yes
apiAddress: :9997

# Права доступа к MediaMTX.
#
# **Без этой секции слой записи не работает вовсе.** Дефолт MediaMTX
# (и в v1.9, и в v1.16 — проверено на обоих бинарниках) отдаёт `api`
# только пользователю с `ips: ['127.0.0.1', '::1']`. Воркер живёт в
# ДРУГОМ контейнере, приходит с адреса docker-сети — и получает
# `HTTP 401 authentication error` на каждый вызов Control API. Дальше
# рушится всё подряд, и симптомы не указывают на причину:
#
#   * пути камер не заводятся → MediaMTX ничего не тянет → live-просмотр
#     (§4) показывает чёрный экран на ВСЕХ камерах и архив (§5) пуст;
#   * статусы потоков не читаются → воркер не пишет `Camera.status`,
#     и все камеры навсегда остаются `offline` (значение по умолчанию),
#     хотя сами по себе исправны;
#   * камера, переключённая в режим `analytics`, при этом показывает
#     `online`: нить аналитики открывает RTSP напрямую, мимо MediaMTX.
#     Ровно это расхождение и выдаёт диагноз.
#
# Healthcheck контейнера ходит с loopback и остаётся зелёным — то есть
# сам по себе отказ не показывает. Видно его только на странице
# мониторинга (`control_api_error`) и в логе воркера.
#
# Пароль в файле — dev-значение для docker-compose (§26 режим 1). В
# production он переопределяется переменной окружения
# `MTX_AUTHINTERNALUSERS_1_PASS` (индекс 1 — вторая запись списка,
# `facewatch`), и файл менять не нужно; тем же значением воркеру
# задаётся `MEDIAMTX_API_URL`.
authInternalUsers:
  # Чтение потоков: HLS-плееру через nginx и RTSP-клиенту при отладке.
  # `ips` пуст — nginx тоже в отдельном контейнере. Права `publish` нет
  # осознанно: камеры MediaMTX тянет сам (`source:` в пути), публиковать
  # сюда некому, а с этим правом любой из внутренней сети мог бы занять
  # путь и подменить поток камеры.
- user: any
  pass:
  ips: []
  permissions:
  - action: read
  - action: playback
  # Control API — только по паролю, зато из любой точки внутренней сети.
  # Индекс этой записи (1) зашит в имя переменной окружения выше.
- user: facewatch
  pass: facewatch-mediamtx-api
  ips: []
  permissions:
  - action: api
  # Локальная отладка внутри контейнера (`docker exec ... wget localhost`)
  # и healthcheck: с loopback пароль не спрашивается.
- user: any
  pass:
  ips: ['127.0.0.1', '::1']
  permissions:
  - action: api
  - action: metrics
  - action: pprof

hls: yes
hlsAlwaysRemux: yes
# 7, а не 5. hlsVariant по умолчанию — lowLatency, а Low-Latency HLS
# требует минимум 7 сегментов: с пятью муксер не поднимается вовсе,
# пишет в лог «Low-Latency HLS requires at least 7 segments», и
# `GET /cam{N}/index.m3u8` отвечает 404. То есть живой просмотр (§4) не
# работал бы ни на одной камере — плитка откатывалась бы на снимок, а
# затем показывала «Камера недоступна».
#
# Проверено на настоящем MediaMTX v1.9.3 с этим самым файлом: при 5
# сегментах — 404 и ошибка муксера в логе, при 7 — 200 и валидный
# плейлист без единой ошибки. До цикла 30 это не всплывало, потому что
# MediaMTX в песочнице не запускался ни разу (13 циклов «нет Docker»),
# а сам он стартует молча и выглядит здоровым.
#
# Задержка при этом не растёт пропорционально: живой край плейлиста
# определяется hlsPartDuration (200 мс) и hlsSegmentDuration, а не общим
# числом хранимых сегментов.
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsAllowOrigin: '*'

pathDefaults:
  # Запись должна идти всегда, а не пока кто-то смотрит live (SPEC §5:
  # непрерывная запись основных потоков). С sourceOnDemand: yes архив
  # состоял бы из дыр между сеансами просмотра.
  sourceOnDemand: no
  # Значения записи задаются пофайлово при заведении пути (record_layer.py),
  # здесь — безопасный дефолт для путей, заведённых мимо API вручную.
  record: no
  recordFormat: fmp4
  recordPath: /media/segments/%path_%s
  recordSegmentDuration: 5m
  # Ротацией занимается воркер (cleanup_old): он удаляет файл вместе со
  # строкой video_segments. Автоудаление MediaMTX оставило бы в архиве
  # строки, указывающие на несуществующие файлы.
  recordDeleteAfter: 0s

# Секция путей пуста намеренно: единственный источник истины о камерах —
# БД, пути заводит воркер через API. Раньше здесь стоял `all_others:
# source: publisher`, разрешавший публикацию в любой несуществующий путь —
# у MediaMTX по умолчанию нет аутентификации, так что это позволяло любому,
# кто дотянулся до внутренней сети, подменить поток любой камеры.
paths: {}
