# ТЗ 13: "Reverse proxy (Nginx) с настройками безопасности (rate limiting)".
# Зона в http{}-контексте (этот файл подключается как /etc/nginx/conf.d/
# default.conf, то есть уже внутри http{} базового образа nginx:alpine).
# Отдельно от Redis-лимита в backend/app/routers/auth.py (10 попыток/5 мин на
# логин+IP) — этот работает на уровень раньше, до того как запрос вообще
# доходит до приложения, и не даёт залить его потоком запросов на /login.
limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
limit_req_status 429;

# Пул постоянных соединений к бэкенду.
#
# Без него `proxy_pass http://host:port` ходит к апстриму по HTTP/1.0 с
# `Connection: close`: **каждый** запрос к /api/ открывает новое TCP-
# соединение и закрывает его. Закрывает активно именно nginx, поэтому
# порт уходит в TIME_WAIT на 60 секунд (2×MSL, в Linux не настраивается).
#
# Замерено на настоящем nginx 1.24 перед настоящим бэкендом (цикл 62,
# 1000 запросов, 8 конкурентных клиентов, `/api/health`):
#
#   | | HTTP/1.0 без пула | HTTP/1.1 + keepalive 32 |
#   |---|---|---|
#   | запросов/с          | 366.2 | 392.3 (+7 %) |
#   | медиана             | 15.65 мс | 15.04 мс |
#   | **TIME_WAIT / 1000 запросов** | **+836** | **0** |
#   | ESTABLISHED к бэкенду | 0 | 16 (пул) |
#
# Выигрыш по задержке на петле скромный — TCP-connect по loopback дёшев,
# и на объекте он будет заметнее. Но дело здесь не в задержке, а в
# исчерпании ресурса: диапазон эфемерных портов по умолчанию — 28232
# (32768-60999), TIME_WAIT — 60 с, то есть устойчивый темп выше
# **~470 запросов/с** к бэкенду выбирает диапазон досуха, после чего
# nginx перестаёт мочь подключиться (EADDRNOTAVAIL) и отвечает 502.
# На объекте §1 (до 250 камер) столько дают мониторинг, дашборд и опрос
# статусов потоков вместе взятые — причём отказ приходит под нагрузкой,
# когда он дороже всего.
#
# keepalive 32 — потолок простаивающих соединений в пуле на воркер, а не
# лимит одновременных: сверх него nginx открывает обычные соединения, как
# и раньше. 32 с запасом покрывает конкурентность одного воркера.
upstream facewatch_backend {
    server facewatch-backend:8000;
    keepalive 32;
    # Соединение из пула переиспользуется не дольше этого — иначе
    # долгоживущее соединение обошло бы перезапуск/пересоздание
    # контейнера бэкенда и держало бы адрес, которого уже нет.
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

# Несколько эндпоинтов (archive/reports/snapshot/prometheus/ws) принимают
# access-токен как ?token=... в query string — необходимо там, где запрос
# не может нести заголовок Authorization (прямые ссылки/скачивание, WS
# handshake браузера, сторонний monitoring). По умолчанию $request в access
# log содержит query string как есть, то есть токен уходит в открытом виде
# в access.log (docs/reviews/REVIEW-2026-08-04T103308Z.md, рекомендация №1
# цикла 7). map вырезает значение параметра token из $args, не трогая
# остальные параметры и порядок; log_format ниже собирает request line из
# $args_safe вместо родного $args.
map $args $args_safe {
    default $args;
    "~^(?<pre>(?:.*&)?)token=[^&]*(?<post>(?:&.*)?)$" "${pre}token=REDACTED${post}";
}

# HSTS только на HTTPS: браузер обязан игнорировать этот заголовок, пришедший
# по обычному HTTP (RFC 6797 §8.1), так что на порту 80 он был бы мёртвым
# кодом. Раньше `add_header` для него стоял прямо в 443-м server{} — но
# заголовки безопасности пришлось вынести в общий сниппет (его надо включать
# и внутрь `location /hls/`, см. nginx-security-headers.conf), а сниппет
# один на оба server{}. Отсюда map: на HTTP значение пустое, а add_header с
# пустым значением nginx не отправляет.
map $https $hsts_value {
    default "";
    on      "max-age=63072000; includeSubDomains";
}

log_format redacted '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri$is_args$args_safe $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /dev/stdout redacted;
    include /etc/nginx/snippets/nginx-locations.conf;
}

# ТЗ 13: TLS/HTTPS доступен из коробки (самоподписанный сертификат,
# сгенерированный docker-entrypoint.sh при первом запуске). HTTP (порт 80)
# сознательно оставлен без принудительного редиректа на HTTPS — это
# однокомпьютерная LAN-система (ТЗ: "локально на одном ПК под Windows"), и
# редирект на самоподписанный сертификат перед тем, как администратор явно
# согласится ему доверять, только добавил бы трение первому запуску.
# Открыть https://<host>:8443 и один раз принять предупреждение браузера —
# осознанный шаг оператора, а не то, что должно ломать обычный HTTP-доступ.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /dev/stdout redacted;
    include /etc/nginx/snippets/nginx-locations.conf;
}
