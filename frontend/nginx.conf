# ТЗ 13: "Reverse proxy (Nginx) с настройками безопасности (rate limiting)".
# Зона в http{}-контексте (этот файл подключается как /etc/nginx/conf.d/
# default.conf, то есть уже внутри http{} базового образа nginx:alpine).
# Отдельно от Redis-лимита в backend/app/routers/auth.py (10 попыток/5 мин на
# логин+IP) — этот работает на уровень раньше, до того как запрос вообще
# доходит до приложения, и не даёт залить его потоком запросов на /login.
limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/nginx-locations.conf;
}

# ТЗ 13: TLS/HTTPS доступен из коробки (самоподписанный сертификат,
# сгенерированный docker-entrypoint.sh при первом запуске). HTTP (порт 80)
# сознательно оставлен без принудительного редиректа на HTTPS — это
# однокомпьютерная LAN-система (ТЗ: "локально на одном ПК под Windows"), и
# редирект на самоподписанный сертификат перед тем, как администратор явно
# согласится ему доверять, только добавил бы трение первому запуску.
# Открыть https://<host>:8443 и один раз принять предупреждение браузера —
# осознанный шаг оператора, а не то, что должно ломать обычный HTTP-доступ.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS только на HTTPS-хосте: браузер игнорирует этот заголовок, если он
    # приходит по обычному HTTP (спецификация), так что на порт 80 его
    # добавлять незачем — там он был бы мёртвым кодом.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    include /etc/nginx/snippets/nginx-locations.conf;
}
