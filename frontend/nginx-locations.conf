# Общие location-блоки для HTTP (80) и HTTPS (443) server{} — вынесены,
# чтобы не дублировать прокси-правила в обоих блоках (nginx.conf).
root /usr/share/nginx/html;
index index.html;

# Фото для поиска/создания персоны бывают 3-8 МБ (дефолт 1 МБ давал 413)
client_max_body_size 25m;

# Сжатие статики: бандлы JS ~500 КБ уходят в ~3 раза быстрее
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

location /api/ {
    proxy_pass http://facewatch-backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
}

location /ws/ {
    proxy_pass http://facewatch-backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}

location /hls/ {
    proxy_pass http://facewatch-mediamtx:8888/;
    proxy_set_header Host $host;
    proxy_buffering off;
    add_header Cache-Control no-cache;
    add_header Access-Control-Allow-Origin *;
}

location / {
    try_files $uri /index.html;
}
