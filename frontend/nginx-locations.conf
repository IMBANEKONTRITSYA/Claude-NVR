# Общие location-блоки для HTTP (80) и HTTPS (443) server{} — вынесены,
# чтобы не дублировать прокси-правила в обоих блоках (nginx.conf).
root /usr/share/nginx/html;
index index.html;

# Фото для поиска/создания персоны бывают 3-8 МБ (дефолт 1 МБ давал 413)
client_max_body_size 25m;

# Сжатие статики: бандлы JS ~500 КБ уходят в ~3 раза быстрее
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# ТЗ 13: "Reverse proxy (Nginx) с настройками безопасности (заголовки)".
# X-Frame-Options/X-Content-Type-Options/Referrer-Policy применимы что по
# HTTP, что по HTTPS — HSTS (только для HTTPS) добавлен отдельно в
# соответствующем server{} блоке nginx.conf. "always" — заголовки должны
# уйти и на error-ответах (4xx/5xx), не только на успешных.
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Более узкий rate limit на вход, чем общий /api/ ниже — здесь чаще всего
# пытаются перебирать пароль. limit_req_zone объявлена в nginx.conf.
location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://facewatch-backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
}

location /api/ {
    proxy_pass http://facewatch-backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
}

location /ws/ {
    proxy_pass http://facewatch-backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}

# Внутренний auth-сабреквест для /hls/ ниже (nginx auth_request module).
# $cookie_hls_auth — узкоспециализированная cookie (path=/hls/), которую
# фронтенд выставляет из того же access-токена, что уже используется для
# Authorization-заголовка на /api/ — не новый секрет, просто ещё один
# транспорт того же токена именно туда, откуда его не вырезает резолвинг
# относительных URL. Кука, а не ?token= в query: HLS-плеер (как нативный
# <video>, так и hls.js) дергает не только index.m3u8, но и .ts-сегменты по
# относительным URI из плейлиста — query string изначального запроса на них
# не переносится, а cookie браузer прикрепляет к каждому запросу по path
# автоматически, независимо от того, как получен URL.
location = /internal/hls-auth {
    internal;
    proxy_pass http://facewatch-backend:8000/api/cameras/hls-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "Bearer $cookie_hls_auth";
}

location /hls/ {
    # P0 (цикл 6): раньше location проксировал в MediaMTX без какой-либо
    # проверки — любой с сетевым доступом к nginx мог смотреть любую камеру
    # без логина, перебирая cam{id}. auth_request закрывает это тем же
    # JWT-контрактом, что и остальные защищённые эндпоинты (backend/app/auth.py).
    auth_request /internal/hls-auth;
    proxy_pass http://facewatch-mediamtx:8888/;
    proxy_set_header Host $host;
    proxy_buffering off;
    add_header Cache-Control no-cache;
    add_header Access-Control-Allow-Origin *;
}

location / {
    try_files $uri /index.html;
}
