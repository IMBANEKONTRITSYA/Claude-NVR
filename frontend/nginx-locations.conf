# Общие location-блоки для HTTP (80) и HTTPS (443) server{} — вынесены,
# чтобы не дублировать прокси-правила в обоих блоках (nginx.conf).
root /usr/share/nginx/html;
index index.html;

# Фото для поиска/создания персоны бывают 3-8 МБ (дефолт 1 МБ давал 413)
client_max_body_size 25m;

# Сжатие статики: бандлы JS ~500 КБ уходят в ~3 раза быстрее
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# ТЗ 13: "Reverse proxy (Nginx) с настройками безопасности (заголовки)".
# X-Frame-Options/X-Content-Type-Options/Referrer-Policy применимы что по
# HTTP, что по HTTPS — HSTS (только для HTTPS) добавлен отдельно в
# соответствующем server{} блоке nginx.conf. "always" — заголовки должны
# уйти и на error-ответах (4xx/5xx), не только на успешных.
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Более узкий rate limit на вход, чем общий /api/ ниже — здесь чаще всего
# пытаются перебирать пароль. limit_req_zone объявлена в nginx.conf.
location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://facewatch-backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
}

location /api/ {
    proxy_pass http://facewatch-backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
}

location /ws/ {
    proxy_pass http://facewatch-backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}

location /hls/ {
    proxy_pass http://facewatch-mediamtx:8888/;
    proxy_set_header Host $host;
    proxy_buffering off;
    add_header Cache-Control no-cache;
    add_header Access-Control-Allow-Origin *;
}

location / {
    try_files $uri /index.html;
}
