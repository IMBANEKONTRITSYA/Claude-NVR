# Заголовки безопасности (ТЗ 13: «Reverse proxy (Nginx) с настройками
# безопасности (заголовки)»), вынесенные в отдельный сниппет.
#
# Вынесены не ради опрятности, а потому что иначе часть ответов их не
# получает. `add_header` в nginx **не накапливается по уровням**: директивы
# наследуются с предыдущего уровня, только если на текущем уровне нет ни
# одного собственного `add_header`. У `location /hls/` их два своих
# (Cache-Control и Access-Control-Allow-Origin), поэтому всё, что стояло в
# server{}, для видеопотока просто пропадало.
#
# Замерено на настоящем nginx 1.24 до этой правки:
#
#   GET /                      → X-Frame-Options, X-Content-Type-Options,
#                                Referrer-Policy, Content-Security-Policy
#   GET /hls/cam1/index.m3u8   → Cache-Control, Access-Control-Allow-Origin
#                                — и больше ничего
#
# То есть плейлисты и .ts-сегменты, проксируемые из MediaMTX, шли без
# `nosniff` (содержимое приходит от камеры), без `X-Frame-Options` и, на
# HTTPS-хосте, без HSTS. Сниппет включается и на уровне server{}, и внутри
# `location /hls/` — единственный способ, которым nginx позволяет
# «унаследовать и дополнить».
#
# "always" — заголовки должны уходить и на error-ответах (4xx/5xx), не
# только на успешных.
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# ТЗ 13: OWASP Top 10 — защита от XSS. default-src 'self' закрывает всё, что
# не перечислено явно; никаких CDN/внешних хостов фронтенд не использует
# (весь JS/CSS собран Vite в свой бандл — самопроверено сборкой + headless
# Chromium без CSP-нарушений в консоли). style-src требует 'unsafe-inline' —
# React проставляет inline style на DOM-узлы (bbox-рамки на видео, цвета
# графиков Recharts). worker-src blob: — hls.js по умолчанию (enableWorker)
# создаёт свой demuxer-воркер через URL.createObjectURL(new Blob(...)), без
# этого разрешения видео на LiveGrid не воспроизводится вообще.
# img-src/media-src blob: — превью загруженного фото на Search и локальный
# <video> для HLS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

# HSTS имеет смысл только на HTTPS: браузер обязан игнорировать этот
# заголовок, пришедший по обычному HTTP (RFC 6797 §8.1), так что на порту 80
# он был бы мёртвым кодом. Раньше это выражалось тем, что `add_header`
# стоял только в 443-м server{} — но тогда его нельзя переиспользовать в
# общем сниппете. `map $https` (см. nginx.conf) даёт пустое значение на
# HTTP, а `add_header` с пустым значением nginx не отправляет.
add_header Strict-Transport-Security $hsts_value always;
