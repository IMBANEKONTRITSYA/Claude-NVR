name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        working-directory: backend
        run: pytest -q

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run pure-logic worker tests
        working-directory: worker
        # Полный requirements.txt воркера тянет OpenCV/InsightFace/ONNX Runtime —
        # слишком тяжело для CI. tests/test_backoff.py зависит только от
        # backoff.py (без cv2/insightface), поэтому запускаем его отдельно.
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Build
        working-directory: frontend
        run: npm run build
