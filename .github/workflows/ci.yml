name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    # ТЗ 14: "покрытие кода тестами не менее 70% (back-end)". Раньше юнит-тесты
    # (auth/шифрование/валидация) шли без реальной БД, поэтому обработчики
    # роутеров почти не покрывались — service-контейнеры дают
    # tests/test_integration_routes.py настоящий Postgres+Redis, как в
    # docker-compose.yml (та же образ pgvector/pgvector:pg16), без
    # необходимости поднимать полный docker compose стек в CI.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: facewatch
          POSTGRES_PASSWORD: facewatch
          POSTGRES_DB: facewatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facewatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://facewatch:facewatch@localhost:5432/facewatch_test
      REDIS_URL: redis://localhost:6379/0
      ALLOW_INSECURE_DEFAULT_SECRETS: "true"
      # Дефолт settings.MEDIA_PATH ("/media") предполагает контейнер, где он
      # смонтирован и доступен на запись; на голом раннере это корень ФС,
      # не пишется от непривилегированного пользователя — TestClient падал
      # с PermissionError на самом первом os.makedirs() при старте lifespan.
      MEDIA_PATH: /tmp/facewatch-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        # Экспорт фрагмента архива (SPEC §5) собирает MP4 вызовом ffmpeg, и
        # в production-образе бэкенда он есть (backend/Dockerfile). На
        # раннере GitHub его нет: тесты экспорта аккуратно пропускаются
        # (skipif на shutil.which), и в этом-то и опасность — прогон
        # выглядит зелёным, а целая функция ТЗ не проверяется вовсе.
        # Замерено: без этого шага 20 тестов уходят в skip и покрытие
        # падает с 77.5% до 74.7%, ниже порога джобы.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov aiosqlite
      - name: Run tests with coverage
        working-directory: backend
        # Цикл 5 поднял честное покрытие с 58.9% до 70.9% (тесты
        # persons/search/reports/ws), но порог CI остался на 55 — разрыв в
        # 16 п.п. не ловил регресс покрытия. Порог поднят до 68 (чуть ниже
        # измеренных 71%, запас на мелкие колебания между прогонами), чтобы
        # CI действительно проваливался при просадке покрытия, а не только
        # показывал его в отчёте (см. docs/reviews/REVIEW_LOG.md, цикл 6).
        # Цикл 19: тесты «ссылочных» эндпоинтов (test_query_token_identity.py,
        # переписанный test_media_rbac.py) подняли покрытие до 76% — порог
        # поднят до 74, чтобы разрыв с фактическим покрытием снова не рос.
        # Цикл 21: test_query_param_bounds.py (границы числовых параметров на
        # 12 эндпоинтах) поднял покрытие до 78% — порог поднят до 76.
        # Цикл 23: test_startup_migrations.py (блок стартовых миграций на
        # временной БД) поднял покрытие до 79% — порог поднят до 77.
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=77 -q

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run pure-logic worker tests
        working-directory: worker
        # Полный requirements.txt воркера тянет OpenCV/InsightFace/ONNX Runtime —
        # слишком тяжело для CI. tests/test_backoff.py и test_onvif_client.py
        # зависят только от stdlib + defusedxml (лёгкая чистая зависимость,
        # защита от XML entity expansion — см. onvif_client.py), test_onvif_api.py —
        # от onvif_api.py, который сознательно вынесен из embed_api.py, чтобы не
        # тащить за собой cv2/insightface (см. onvif_api.py); fastapi/httpx лёгкие,
        # cv2/insightface/onnxruntime по-прежнему не ставятся в CI.
        # Цикл 24: sqlalchemy добавлена ради tests/test_segment_index.py —
        # индексация сегментов слоя записи ходит в БД, и без неё тест
        # graceful-скипался бы, то есть production path слоя записи не
        # проверялся бы в CI вообще (тест сам поднимает SQLite-файл, сервис
        # Postgres джобе не нужен).
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi httpx defusedxml sqlalchemy
          pytest tests/ -q

  upscaler:
    runs-on: ubuntu-latest
    # До цикла 20 у сервиса апскейла не было ни тестов, ни CI-джобы —
    # единственный сервис проекта без покрытия вообще, и найденный в цикле
    # 20 P1 (сессия БД, открытая на всё время инференса) сидел именно там.
    # Postgres нужен по-настоящему: проверка смотрит в pg_stat_activity и
    # проверяет, что ротация может удалить строку во время апскейла, —
    # на моках ни то, ни другое не наблюдаемо.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: facewatch
          POSTGRES_PASSWORD: facewatch
          POSTGRES_DB: facewatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facewatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://facewatch:facewatch@localhost:5432/facewatch_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install upscaler deps (без GFPGAN/torch)
        working-directory: upscaler
        # Полный requirements.txt тянет torch/basicsr/gfpgan — гигабайты и
        # минуты сборки. Сам GFPGAN импортируется лениво, внутри
        # _load_gfpgan(), поэтому модуль импортируется и тестируется без
        # него; в тестах enhance() и так подменяется, потому что прогон
        # модели в CI недопустимо долгий.
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless sqlalchemy psycopg2-binary redis pytest
      - name: Run upscaler tests
        working-directory: upscaler
        run: pytest tests/ -q

  perf:
    runs-on: ubuntu-latest
    # Бенчмарки горячих путей (SPEC §19, §23, §26): decode FPS, стоимость
    # префильтра движения, ms/лицо на CPU. Джоба НЕ гейтит мердж по
    # абсолютным числам и не может: раннер GitHub мощнее целевого сервера
    # (2× Xeon E5-2670, без AVX2), и любой порог, взятый с него, на
    # целевом железе не значил бы ничего.
    #
    # Смысл в другом: числа печатаются в лог и складываются в артефакт,
    # чтобы отчёт цикла сравнивал их с прошлым циклом на одинаковом
    # раннере. Деградация больше 15% — carryover P2, решение принимает
    # цикл, а не CI.
    #
    # continue-on-error: бенчмарк не должен ронять мердж функциональной
    # правки, если ffmpeg на раннере повёл себя иначе.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install bench deps
        run: pip install opencv-python-headless numpy onnxruntime onnx
      - name: Run benchmarks
        run: python perf/bench.py --json | tee perf-results.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf-results.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      # SPEC §21 перечисляет JS-тестраннер в стеке, но до цикла 28 его в
      # проекте не было вовсе: логика интерфейса проверялась только
      # статическими проверками из backend/tests, которые видят текст
      # файла, а не поведение. Первый набор — раскладка стены и цифровой
      # зум (§4): сколько плиток реально попадёт на экран, тестом видно, а
      # чтением исходника — нет.
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      # -r читает requirements.txt напрямую (без установки тяжёлых ML-пакетов
      # воркера) и резолвит версии против БД уязвимостей PyPI/OSV.
      - name: Audit backend dependencies
        run: |
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1325
      - name: Audit worker dependencies
        run: |
          pip-audit -r worker/requirements.txt --ignore-vuln PYSEC-2026-1325
      # PYSEC-2026-1325 — таймингова атака Minerva в чистом Python-бэкенде
      # пакета ecdsa (транзитивная зависимость python-jose). Апстрим не
      # выпускает фикс (архитектурное ограничение), а FaceWatch подписывает
      # JWT только алгоритмом HS256 (симметричный HMAC) — код ecdsa вообще
      # не выполняется. Игнорируем предметно, а не глобально.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      # npm audit не блокирует сборку: оставшиеся находки — esbuild/vite
      # (уязвимость только dev-сервера, не собранного билда) и react-router
      # RSC-режим (проект не использует React Server Components/framework
      # mode, только клиентский declarative-роутинг) — не применимы к
      # продакшен-развёртыванию, но остаются видимыми в логе CI.
      - name: Audit frontend dependencies (report only)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=moderate

  # SPEC.md §14: "Нагрузочное тестирование: сценарий на 16 камер, проверка
  # стабильности FPS и задержек". loadtest/locustfile.py закрывает API-слой
  # этого требования (см. loadtest/README.md для честных границ теста —
  # не покрывает реальную RTSP-декодировку/инференс воркера, нужны физические
  # камеры/GPU). Рекомендация цикла 13 (docs/reviews/REVIEW_LOG.md): держать
  # это необязательным workflow_dispatch-джобом, а не частью обычного
  # push/PR-конвейера — прогон занимает минуты, а не секунды, и не должен
  # блокировать обычную разработку. Запускается вручную из вкладки Actions
  # или через `gh workflow run ci.yml`.
  loadtest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: facewatch
          POSTGRES_PASSWORD: facewatch
          POSTGRES_DB: facewatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facewatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://facewatch:facewatch@localhost:5432/facewatch_test
      REDIS_URL: redis://localhost:6379/0
      ALLOW_INSECURE_DEFAULT_SECRETS: "true"
      MEDIA_PATH: /tmp/facewatch-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps + locust
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt locust
      - name: Start backend
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && exit 0
            sleep 1
          done
          echo "backend did not become healthy in time"
          cat /tmp/backend.log
          exit 1
      - name: Run 16-camera load test (SPEC 14)
        run: |
          locust -f loadtest/locustfile.py --headless \
              -u 16 -r 4 -t 2m \
              --host http://127.0.0.1:8000 \
              --csv loadtest/results/ci-run \
              --exit-code-on-error 1
      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/backend.log || true
      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-results
          path: loadtest/results/
          retention-days: 14
