# ТЗ 12: "структурированные логи... с ротацией". Docker-драйвер json-file по
# умолчанию не ограничен по размеру — на системе, работающей 24/7 (ТЗ:
# "стабильно работать 24/7 без деградации"), это медленная, но верная утечка
# места на диске. Единый якорь на все сервисы: 10 файлов по 10 МБ (100 МБ на
# контейнер) с лихвой хватает на разбор инцидента и не требует держать
# отдельный лог-агрегатор (Loki) для однокомпьютерного развёртывания.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "10"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: facewatch-postgres
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facewatch}
      POSTGRES_DB: ${POSTGRES_DB:-facewatch}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Только на loopback: backend/worker/upscaler ходят по внутренней
      # docker-сети (хост "postgres"), порт наружу нужен лишь для локальной
      # отладки psql с той же машины. POSTGRES_PASSWORD по умолчанию —
      # публично известное значение "facewatch" (ТЗ 13), поэтому открывать
      # порт на все интерфейсы означало бы БД без реальной защиты.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facewatch}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: facewatch-redis
    logging: *default-logging
    ports:
      # Redis не требует пароля по умолчанию — публикация на все интерфейсы
      # дала бы любому в локальной сети полный доступ к очередям/кэшу.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: facewatch-mediamtx
    logging: *default-logging
    ports:
      # MediaMTX не требует аутентификации по умолчанию (ТЗ 13). Worker
      # публикует камеры и nginx проксирует HLS через внутреннюю docker-сеть
      # (хост "mediamtx") — публикация наружу никому не нужна и означала бы,
      # что любой в локальной сети смотрит камеры без входа в систему.
      # Оставлено на loopback только для локальной отладки через VLC/ffplay.
      - "127.0.0.1:8554:8554"   # RTSP
      - "127.0.0.1:8888:8888"   # HLS
      - "127.0.0.1:8889:8889"   # WebRTC
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: facewatch-backend
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-facewatch}:${POSTGRES_PASSWORD:-facewatch}@postgres:5432/${POSTGRES_DB:-facewatch}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      RTSP_ENCRYPTION_KEY: ${RTSP_ENCRYPTION_KEY:-ZmFjZXdhdGNoLWRldi1rZXktMzJieXRlcy1iYXNlNjQ=}
      MEDIA_PATH: /media
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      WORKER_URL: http://worker:9000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - media:/media
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  worker:
    build: ./worker
    container_name: facewatch-worker
    logging: *default-logging
    depends_on:
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-facewatch}:${POSTGRES_PASSWORD:-facewatch}@postgres:5432/${POSTGRES_DB:-facewatch}
      REDIS_URL: redis://redis:6379/0
      RTSP_ENCRYPTION_KEY: ${RTSP_ENCRYPTION_KEY:-ZmFjZXdhdGNoLWRldi1rZXktMzJieXRlcy1iYXNlNjQ=}
      MEDIA_PATH: /media
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    volumes:
      - media:/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9000/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Первый старт качает модель InsightFace (~30 МБ) — даём запас
      start_period: 300s
    restart: unless-stopped
    # По умолчанию Docker ждёт SIGTERM только 10с и досылает SIGKILL —
    # graceful shutdown (закрытие VideoCapture/VideoWriter, остановка
    # ffmpeg-репабликации по каждой камере) может не уложиться. Воркер сам
    # ограничивает суммарное ожидание нитей 8с, здесь оставляем запас.
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 4G

  upscaler:
    build: ./upscaler
    container_name: facewatch-upscaler
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-facewatch}:${POSTGRES_PASSWORD:-facewatch}@postgres:5432/${POSTGRES_DB:-facewatch}
      REDIS_URL: redis://redis:6379/0
      MEDIA_PATH: /media
      UPSCALE_BACKEND: ${UPSCALE_BACKEND:-gfpgan}
    volumes:
      - media:/media
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G

  backup:
    # Официальный образ postgres:16-alpine — версия pg_dump совпадает с
    # сервером (pgvector/pg16), плюс встроенный busybox crond, отдельный
    # Dockerfile/образ не нужен (ТЗ 12: ежедневный автобэкап + ручной запуск).
    image: postgres:16-alpine
    container_name: facewatch-backup
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-facewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facewatch}
      POSTGRES_DB: ${POSTGRES_DB:-facewatch}
      # Cron-выражение расписания бэкапа (по умолчанию — раз в сутки, 03:00).
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backup:/backup:ro
      # По умолчанию именованный том Docker. Для хранения на отдельном диске
      # или сетевом хранилище (ТЗ 12) переопределите путь через
      # docker-compose.override.yml, например:
      #   volumes: { backups: { driver: local, driver_opts: { type: none, o: bind, device: D:/facewatch-backups } } }
      - backups:/backups
    entrypoint: ["/backup/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond >/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  frontend:
    build: ./frontend
    container_name: facewatch-frontend
    logging: *default-logging
    depends_on:
      - backend
    ports:
      - "8080:80"
      # ТЗ 13: TLS/HTTPS доступен по умолчанию — самоподписанный сертификат
      # генерируется автоматически при первом запуске (docker-entrypoint.sh).
      - "8443:443"
    volumes:
      # Сертификат переживает пересоздание контейнера — иначе браузеру
      # пришлось бы заново принимать предупреждение при каждом обновлении.
      - frontend_certs:/etc/nginx/certs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  media:
  backups:
  frontend_certs:
